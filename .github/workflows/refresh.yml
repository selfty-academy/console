name: Refresh console
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,9,12,15,18 * * *'   # ~8h, 11h, 14h, 17h, 20h heure de Paris (été)
permissions:
  contents: write
concurrency: refresh
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances
        run: pip install --quiet openpyxl pillow
      - name: Données (Sheets en accès lien)
        run: |
          curl -sL -o pipeline/candidature-webi.xlsx "https://docs.google.com/spreadsheets/d/${{ secrets.SHEET_WEBI }}/export?format=xlsx"
          curl -sL -o pipeline/liste-attente.xlsx "https://docs.google.com/spreadsheets/d/${{ secrets.SHEET_ECOLE }}/export?format=xlsx"
          python -c "import openpyxl; openpyxl.load_workbook('pipeline/candidature-webi.xlsx'); openpyxl.load_workbook('pipeline/liste-attente.xlsx'); print('xlsx valides')"
      - name: Build + chiffrement
        env:
          TZ: Europe/Paris
        run: |
          cd pipeline
          python build.py
          python encrypt_page.py console.html ../index.html "${{ secrets.PAGE_CODE }}" "Console Selfty"
      - name: Publier
        run: |
          git config user.name "console-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || { git commit -m "MAJ auto console"; git push; }
