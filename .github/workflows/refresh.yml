name: Refresh console
on:
  workflow_dispatch:
  schedule:
    # toutes les 30 min en journée (minutes décalées : GitHub throttle les crons de l'heure pile)
    - cron: '7,37 5-20 * * *'   # ~7h-22h heure de Paris (été)
permissions:
  contents: write
concurrency: refresh
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances
        run: pip install --quiet openpyxl pillow
      - name: Données (Sheets en accès lien)
        run: |
          curl -sL -o pipeline/candidature-webi.xlsx "https://docs.google.com/spreadsheets/d/${{ secrets.SHEET_WEBI }}/export?format=xlsx"
          curl -sL -o pipeline/liste-attente.xlsx "https://docs.google.com/spreadsheets/d/${{ secrets.SHEET_ECOLE }}/export?format=xlsx"
          python -c "import openpyxl; openpyxl.load_workbook('pipeline/candidature-webi.xlsx'); openpyxl.load_workbook('pipeline/liste-attente.xlsx'); print('xlsx valides')"
      - name: Build + chiffrement
        env:
          TZ: Europe/Paris
          PONT_URL: ${{ secrets.PONT_URL }}
          PONT_KEY: ${{ secrets.PONT_KEY }}
          ICLOSED_KEY: ${{ secrets.ICLOSED_KEY }}
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          SHOW_TEST: ${{ secrets.SHOW_TEST }}
          TEST_CALLS: ${{ secrets.TEST_CALLS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          cd pipeline
          python build.py
          python encrypt_page.py console.html ../index.html "${{ secrets.PAGE_CODE }}" "Console Selfty"
      - name: Rappels de paiement J-2 (script Contrats, mails depuis selfty.academy)
        env:
          PONT_KEY: ${{ secrets.PONT_KEY }}
        run: |
          curl -s -m 120 -L -X POST "https://script.google.com/macros/s/AKfycbwhr4s_j6vijp-aWj0qWBYIR-8qSYy-tFUoasujsrqCr1-jVIomeBfiUMtkfixxJVLd/exec" \
            -H "Content-Type: application/json" -d "{\"what\":\"rappels\",\"key\":\"$PONT_KEY\"}" | head -c 600; echo
      - name: Bilan hebdo des clientes (vendredi 16h, lien Tally par mail depuis selfty.academy, une fois par semaine)
        env:
          PONT_KEY: ${{ secrets.PONT_KEY }}
        run: |
          curl -s -m 120 -L "https://script.google.com/macros/s/AKfycbwhr4s_j6vijp-aWj0qWBYIR-8qSYy-tFUoasujsrqCr1-jVIomeBfiUMtkfixxJVLd/exec" \
            -H "Content-Type: application/json" -d "{\"what\":\"eow_rappel\",\"key\":\"$PONT_KEY\"}" | head -c 600; echo
      - name: Notif Telegram nouveaux calls
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python pipeline/notify_calls.py
      - name: Publier
        run: |
          git config user.name "console-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html pipeline/state-icalls.json
          git diff --cached --quiet || { git commit -m "MAJ auto console"; git push; }
